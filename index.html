const od={};function sync(l){peers=l||[];peers.forEach(p=>{const q=p.presence;if(p.sameTab||!q||typeof q.s!=="number")return;const pr=q.rs||0;if(pr>re||(pr===re&&q.s>s&&q.s<=10)){if(pr>re){qd={};ch={}}re=pr;s=q.s;tele();story()}})}
(async()=>{try{room=await claude.use("room");if(room){room.onPeers(c=>sync(c.peers),e=>{rst="Room error: "+e.code});sync(room.peers());rst="Room on"}else rst="Multiplayer unavailable here"}catch(e){room=null;rst="Multiplayer error"}})();
function tele(){const p=s>0?M[Math.min(s,10)-1]:[0,0,0,30];me.position.set(p[2]+(s>0?-4:0),0,p[3]+(s>0?6:0));hp=10}
function push(f){const v=[Math.round(me.position.x*5),Math.round(me.position.z*5),Math.round(ry*10),s,re,name,atkT>0?1:0].join();if(room&&(f||v!==last)){last=v;try{room.presence({x:me.position.x,z:me.position.z,r:ry,s:s,rs:re,n:name,a:atkT>0?1:0})}catch(e){}}}
function story(){if(s>0&&s<=10){dq=DL[s-1];di=0;paused=true;showDl()}else{dq=null;$("dl").style.display="none";paused=false}hud()}
function showDl(){const b=$("dl");if(dq&&di>=dq.length){const qs=Q[s-1],k=qd[s-1]||0;if(qs&&k<qs.length){qd[s-1]=k+1;ask(qs[k]);return}}if(!dq||di>=dq.length){b.style.display="none";paused=false;hud();return}const l=dq[di].split("|");b.style.display="block";b.innerHTML="<b style='color:var(--ac)'>"+l[0]+":</b> "+l[1]+"<br><button id=nx>"+(di<dq.length-1?"Next ▶":(s>=10?"The end ▶":"Continue ▶"))+"</button>";$("nx").onclick=()=>{di++;showDl()}}
function hud(){const o=$("obj");if(s>=10){o.innerHTML="<b>The End</b><br>"+endTxt()+" <button id=rp style='pointer-events:auto;margin-top:6px;border:0;border-radius:8px;padding:6px 12px;background:var(--ac);font-weight:700'>🔄 Play again</button>";$("rp").onclick=()=>{re=Date.now();s=0;qd={};ch={};tele();hud();push(true)};return}
 const m=M[s];o.innerHTML="<b>Mission "+(s+1)+"/10: "+m[0]+"</b><br>"+m[1]+" <span id=ar>➤</span> <span id=ds></span>"}
function done(){s++;story();push(true)}
function atk(){if(paused||atkT>0)return;atkT=.35;const f=[Math.sin(ry),Math.cos(ry)];
 EN.forEach(e=>{if(e.dead>clk)return;const dx=e.g.position.x-me.position.x,dz=e.g.position.z-me.position.z,d=Math.hypot(dx,dz);if(d<4&&(dx*f[0]+dz*f[1])/d>.3){e.hp--;e.g.position.x+=f[0]*1.2;e.g.position.z+=f[1]*1.2;if(e.hp<=0){e.dead=clk+(e.boss?9999:12);e.g.visible=false}}});
 if(M[s]&&M[s][4]==="kill"){const n=npcs[s];if(n.visible&&Math.hypot(n.position.x-me.position.x,n.position.z-me.position.z)<4.5){n.visible=false;done()}}
 push(true)}
$("atk").addEventListener("pointerdown",e=>{atk();e.preventDefault()});
addEventListener("keydown",e=>{if(e.key.startsWith("Arrow")){keys[e.key]=1;e.preventDefault()}if(e.code==="Space"&&document.activeElement!==$("nm")){atk();e.preventDefault()}});
addEventListener("keyup",e=>{delete keys[e.key]});
document.querySelectorAll("#dp button").forEach(b=>{const k=b.dataset.k;b.addEventListener("pointerdown",e=>{keys[k]=1;e.preventDefault()});["pointerup","pointerleave","pointercancel"].forEach(v=>b.addEventListener(v,()=>delete keys[k]))});
$("go").onclick=()=>{if(window.__joinRoom){try{window.__joinRoom($("rc").value.trim()||"hamlet")}catch(e){}}name=$("nm").value.trim()||"Hamlet";me.remove(me.children[me.children.length-1]);me.add(lab(name,"#ffd54a"));$("ov").remove();paused=false;hud();push(true)};
const lt=performance.now();let prev=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-prev)/1000,.05);prev=now;clk+=dt;
 let mv=false;if(!paused){if(keys.ArrowLeft)ry+=2.3*dt;if(keys.ArrowRight)ry-=2.3*dt;const sp=keys.ArrowUp?9:keys.ArrowDown?-4.5:0;mv=!!sp;
  me.position.x+=Math.sin(ry)*sp*dt;me.position.z+=Math.cos(ry)*sp*dt;
  COL.forEach(c=>{const dx=me.position.x-c[0],dz=me.position.z-c[1],ox=c[2]-Math.abs(dx),oz=c[3]-Math.abs(dz);if(ox>0&&oz>0){if(ox<oz)me.position.x+=(dx<0?-1:1)*ox;else me.position.z+=(dz<0?-1:1)*oz}});
  me.position.x=Math.max(-72,Math.min(72,me.position.x));me.position.z=Math.max(-72,Math.min(72,me.position.z))}
 if(atkT>0)atkT-=dt;me.rotation.y=ry;anim(me,mv,clk,atkT);
 if(s<10){const m=M[s],px=m[2],pz=m[3],d=Math.hypot(me.position.x-px,me.position.z-pz);mk0.position.x=px;mk0.position.z=pz;mk0.visible=m[4]!=="kill";
  npcs[s].visible=m[4]!=="boss"&&(m[4]!=="kill"||npcs[s].visible||true);
  if(!paused&&d<2.8&&m[4]==="go")done();
  if(m[4]==="boss"&&!duel&&d<14&&!paused){duel=true;boss=[guard(px-6,pz-8,1,"Laertes",0x8d99a6,6),guard(px+6,pz-8,1,"Claudius",0xa3202f,5)];boss.forEach(b=>{b.g.visible=true})}
  if(duel&&boss.every(b=>b.dead>clk)){duel=false;done()}
  const ds=$("ds");if(ds){ds.textContent=Math.round(d)+" m";const a=Math.atan2(px-me.position.x,pz-me.position.z)-ry;$("ar").style.transform="rotate("+(-a)+"rad)"}}
 EN.forEach(e=>{const g=e.g;if(e.dead>clk&&e.dead<9000){g.visible=false;return}if(e.dead&&e.dead<9000&&e.dead<=clk){e.dead=0;e.hp=e.mh;g.visible=true;g.position.set(e.hx,0,e.hz)}if(e.dead)return;
  const dx=me.position.x-g.position.x,dz=me.position.z-g.position.z,d=Math.hypot(dx,dz),rg=e.boss?60:16;let w=false;
  if(!paused&&d<rg&&d>2.1){const v=(e.boss?5.5:4)*dt;g.position.x+=dx/d*v;g.position.z+=dz/d*v;w=true}
  if(d<rg)g.rotation.y=Math.atan2(dx,dz);e.cd-=dt;e.at-=dt;
  if(!paused&&d<=2.4&&e.cd<=0){e.cd=e.boss?.9:1.3;e.at=.35;hp-=e.boss?2:1;if(hp<=0){hp=10;tele()}}
  anim(g,w,clk,e.at)});
 const f=[Math.sin(ry),Math.cos(ry)];cam.position.lerp(new T.Vector3(me.position.x-f[0]*9,5.5,me.position.z-f[1]*9),.2);cam.lookAt(me.position.x+f[0]*3,1.6,me.position.z+f[1]*3);
 if(ls!==s){ls=s;sc.background=new T.Color(SKY[s]);sc.fog=new T.Fog(SKY[s],40,150)}
 const seen={};peers.forEach(p=>{const q=p.presence;if(p.sameTab||!q||typeof q.x!=="number")return;const k=q.n||"?";seen[k]=1;let o=od[k];if(!o){o=od[k]=hamlet(k,0x6a1b9a);o.position.set(q.x,0,q.z)}
  o.position.x+=(q.x-o.position.x)*.3;o.position.z+=(q.z-o.position.z)*.3;o.rotation.y=q.r;anim(o,Math.hypot(q.x-o.position.x,q.z-o.position.z)>.25,clk,q.a?.3:0)});
 Object.keys(od).forEach(k=>{if(!seen[k]){sc.remove(od[k]);delete od[k]}});
 $("hp").textContent="❤️ ".repeat(Math.max(0,Math.ceil(hp/2)))+" ("+Math.max(hp,0)+")";$("pl").textContent="Players: "+(1+Object.keys(seen).length)+" | "+(room?(room.connected()?"LIVE":"OFFLINE"):"no room")+" | "+rst+" | peers "+peers.length;
 rd.render(sc,cam)}
hud();requestAnimationFrame(loop);setInterval(()=>push(false),100);
</script>
